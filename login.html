<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingreso a JamuWeb</title>
  <style>
    :root {
      --bg: #FFF8E1;
      --card: #FFF3B0;
      --text: #3E2723;
      --accent: #FFB300;
      --shadow-light: 10px 10px 20px #d6c26b, -10px -10px 20px #fffdd2;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    .login-box {
      background: var(--card);
      padding: 40px;
      border-radius: 20px;
      box-shadow: var(--shadow-light);
      text-align: center;
      width: 320px;
    }

    h2 {
      margin-bottom: 20px;
      color: var(--text);
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: none;
      border-radius: 12px;
      background: #fff9d1;
      box-shadow: inset 4px 4px 8px rgba(0,0,0,0.1), inset -4px -4px 8px rgba(255,255,255,0.3);
      color: var(--text);
      font-size: 15px;
      outline: none;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 14px;
      background: linear-gradient(135deg, var(--accent), #FFD54F);
      border: none;
      border-radius: 12px;
      color: #3E2723;
      font-weight: 600;
      cursor: pointer;
      box-shadow: var(--shadow-light);
      transition: transform .3s;
    }

    button:hover {
      transform: scale(1.03);
    }

    p {
      font-size: 13px;
      color: #6D4C41;
    }

    .link {
      color: var(--accent);
      cursor: pointer;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h2 id="title">Iniciar Sesión</h2>
    <input type="text" id="username" placeholder="Usuario">
    <input type="password" id="password" placeholder="Contraseña">
    <button id="actionBtn">Ingresar</button>
    <p id="toggleText">¿No tienes cuenta? <span class="link" id="toggleMode">Regístrate</span></p>
  </div>

  <script>
    const username = document.getElementById("username");
    const password = document.getElementById("password");
    const actionBtn = document.getElementById("actionBtn");
    const title = document.getElementById("title");
    const toggleMode = document.getElementById("toggleMode");
    const toggleText = document.getElementById("toggleText");

    let isLogin = true;

    function switchMode() {
      isLogin = !isLogin;
      if (isLogin) {
        title.textContent = "Iniciar Sesión";
        actionBtn.textContent = "Ingresar";
        toggleText.innerHTML = '¿No tienes cuenta? <span class="link" id="toggleMode">Regístrate</span>';
      } else {
        title.textContent = "Crear Cuenta";
        actionBtn.textContent = "Registrar";
        toggleText.innerHTML = '¿Ya tienes cuenta? <span class="link" id="toggleMode">Inicia sesión</span>';
      }
      document.getElementById("toggleMode").addEventListener("click", switchMode);
    }

    toggleMode.addEventListener("click", switchMode);

    actionBtn.addEventListener("click", () => {
      const user = username.value.trim();
      const pass = password.value.trim();
      if (!user || !pass) {
        alert("Por favor completa todos los campos.");
        return;
      }

      if (isLogin) {
        const storedUser = localStorage.getItem("user");
        const storedPass = localStorage.getItem("pass");
        if (user === storedUser && pass === storedPass) {
          alert("Bienvenido a JamuWeb 💛");
          window.location.href = "jamuweb.html";
        } else {
          alert("Usuario o contraseña incorrectos.");
        }
      } else {
        localStorage.setItem("user", user);
        localStorage.setItem("pass", pass);
        alert("Usuario registrado correctamente 💫");
        isLogin = true;
        title.textContent = "Iniciar Sesión";
        actionBtn.textContent = "Ingresar";
        toggleText.innerHTML = '¿No tienes cuenta? <span class="link" id="toggleMode">Regístrate</span>';
        document.getElementById("toggleMode").addEventListener("click", switchMode);
      }
    });
  </script>
</body>
</html>
